# Builds the Windows and macOS packages. On pull requests it runs only for a release PR (branch release/vX.Y.Z, see
# release.yml), so the packages are proven before the version is tagged; other PRs skip it. Run it by hand
# (Actions -> Package -> Run workflow) to get the files as
# downloadable artifacts, or push a version tag (git tag v0.1.0 && git push origin v0.1.0) to also create a DRAFT
# release with the files attached. A draft is not public until you publish it.
name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:  # only a release PR builds (the jobs check the branch name); nothing is released

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false  # the job only reads the repository
          fetch-depth: 0  # the version comes from the git tag
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: The tag must match the version in the source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/release.py check-tag "$GITHUB_REF_NAME"
      - name: Install Inno Setup if the runner image lacks it
        shell: powershell
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build (zip + installer, self-tested)
        shell: powershell
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: windows
          path: |
            dist/Klotse-*-setup.exe
            dist/Klotse-*-portable.zip
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }          # Apple Silicon
          - { os: macos-15-intel, arch: x86_64 }   # Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false  # the job only reads the repository
          fetch-depth: 0  # the version comes from the git tag
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Build (app + dmg, self-tested)
        # Without signing secrets the app is ad-hoc signed only; see packaging/README.md for Developer ID and notarization.
        run: bash packaging/macos/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Klotse-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          path: artifacts
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd artifacts && sha256sum */* > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" artifacts/*/* artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Klotse ${GITHUB_REF_NAME#v}"
