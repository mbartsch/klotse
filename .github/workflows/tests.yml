name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
        shell: powershell
        run: |
          $files = Get-ChildItem tests -File -Filter 'test_*.py' | Sort-Object Name
          $selected = @()
          for ($index = 0; $index -lt $files.Count; $index++) {
            if (($index % 3) -eq [int]$env:SHARD) {
              $selected += $files[$index].FullName
            }
          }
          pytest -q $selected

  macos-smoke:
    name: macOS Qt smoke tests
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check packaged Qt startup
        run: python -m klotse --self-test
      - name: Run loading and application smoke tests
        run: python -m pytest -q tests/test_overview_loading.py tests/test_app.py

  macos-arm-smoke:
    name: macOS arm64 Qt smoke tests
    runs-on: macos-26
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check packaged Qt startup
        run: python -m klotse --self-test
      - name: Run loading and application smoke tests
        run: python -m pytest -q tests/test_overview_loading.py tests/test_app.py
