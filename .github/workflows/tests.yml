name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_*.py' | sort)
          selected=()
          for index in "${!files[@]}"; do
            if (( index % 3 == SHARD )); then
              selected+=("${files[$index]}")
            fi
          done
          pytest -q "${selected[@]}"
