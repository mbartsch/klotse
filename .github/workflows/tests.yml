name: Tests

on:
  pull_request:
    # ready_for_review: a draft is skipped below, so it must run when the draft is marked ready
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_suite_runner:
        description: Run the whole suite (not shards) on this runner; "none" skips it
        type: choice
        default: ubuntu-latest
        options: [none, ubuntu-latest, macos-15-intel, macos-26, windows-latest]
      qt_platform:
        description: QT_QPA_PLATFORM for the full suite
        type: choice
        default: offscreen
        options: [offscreen, minimal, xcb]
      python_version:
        description: Python version for the full suite
        type: choice
        default: "3.12"
        options: ["3.12", "3.13", "3.14"]

permissions:
  contents: read

jobs:
  full-suite:
    name: full suite (${{ inputs.full_suite_runner }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_suite_runner != 'none'
    runs-on: ${{ inputs.full_suite_runner }}
    timeout-minutes: 35  # a passing run takes 9-12 minutes on Windows and arm64 macOS and 18-23 on Intel macOS
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: ${{ inputs.qt_platform }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 xvfb
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the whole suite
        timeout-minutes: 30
        shell: bash
        run: |
          python scripts/run_tests.py

  # Every pull request that is not a draft, and every push to master.
  pytest:
    name: pytest (linux, shard ${{ matrix.shard }})
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        timeout-minutes: 5  # a passing Linux shard takes 1-2 minutes with its set-up
        shell: bash
        run: |
          files=$(python -c "import glob, os; f = sorted(p.replace(os.sep, '/') for p in glob.glob('tests/test_*.py')); print(' '.join(f[int(os.environ['SHARD'])::int(os.environ['SHARD_COUNT'])]))")
          python scripts/run_tests.py $files

  # Windows and macOS: only for release pull requests (branch release/vX.Y.Z), not drafts.
  pytest-release:
    name: pytest (${{ matrix.os }}, shard ${{ matrix.shard }})
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && startsWith(github.head_ref, 'release/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      SHARD_COUNT: "6"  # the length of the shard list above
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
        timeout-minutes: 5  # a passing Linux shard takes 1-2 minutes with its set-up
        shell: bash
        run: |
          files=$(python -c "import glob, os; f = sorted(p.replace(os.sep, '/') for p in glob.glob('tests/test_*.py')); print(' '.join(f[int(os.environ['SHARD'])::int(os.environ['SHARD_COUNT'])]))")
          python scripts/run_tests.py $files
