name: Cloud emulators

# Images are pinned by digest (zizmor). Update them with the release you test, and keep the comment in step.
# Runs the cloud tests against Floci emulators (AWS, OCI, GCP, Azure) with the provider CLIs installed in this job. The CLIs
# are not needed on a developer machine: `pytest` skips these tests unless KLOTSE_EMULATORS=1 (set only here).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulators:
    name: Floci emulators and provider CLIs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Each emulator listens on one port on the runner (AWS 4566, OCI 4599, GCP 4588, Azure 4577); see the Floci READMEs.
      floci-aws:
        image: floci/floci@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c  # latest at the time of writing
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -s -o /dev/null http://localhost:4566/" --health-interval 5s --health-timeout 5s --health-retries 24
      floci-oci:
        image: floci/floci-oci@sha256:7b976aabefd8a53ebf09df52b788a1b3c3cd4e71f2e0b29efe8f9d8b3954fbd3  # latest at the time of writing
        ports: ["4599:4599"]
        options: >-
          --health-cmd "curl -s -o /dev/null http://localhost:4599/" --health-interval 5s --health-timeout 5s --health-retries 24
      floci-gcp:
        image: floci/floci-gcp@sha256:d02e70407d6b37c3e24e31b5ccf100606735cba4f84fd476708b35afd052abb3  # latest at the time of writing
        ports: ["4588:4588"]
        options: >-
          --health-cmd "curl -s -o /dev/null http://localhost:4588/" --health-interval 5s --health-timeout 5s --health-retries 24
      floci-az:
        image: floci/floci-az@sha256:f9d7552c9c02be84f12e266d6201ff52c1f23421af94943cbf687526ded89790  # latest at the time of writing
        ports: ["4577:4577"]
        options: >-
          --health-cmd "curl -s -o /dev/null http://localhost:4577/" --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      KLOTSE_EMULATORS: "1"
      # The AWS CLI and boto3 read these; the emulator accepts any non-empty keys.
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # The OCI CLI sends its requests to this address when set (OCI_CLI_ENDPOINT is the environment form of --endpoint).
      OCI_CLI_ENDPOINT: http://127.0.0.1:4599
      FLOCI_GCP_URL: http://127.0.0.1:4588
      FLOCI_AZ_URL: http://127.0.0.1:4577
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install Qt system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 xvfb
      - name: Install test dependencies
        timeout-minutes: 8
        run: python -m pip install -r requirements-dev.txt
      - name: Install the OCI CLI (pinned)
        timeout-minutes: 5
        run: python -m pip install "oci-cli==3.95.1"
      - name: Show the provider CLIs (AWS CLI, gcloud and Azure CLI come with the runner image)
        run: |
          set -x
          aws --version
          gcloud --version | head -n 1
          az version --output table | head -n 3
          oci --version
      - name: Wait for the emulators
        run: |
          for port in 4566 4599 4588 4577; do
            for attempt in $(seq 1 60); do
              if curl -s -o /dev/null "http://127.0.0.1:${port}/"; then echo "port ${port} up"; break; fi
              if [ "$attempt" -eq 60 ]; then echo "port ${port} did not answer"; exit 1; fi
              sleep 2
            done
          done
      - name: Run the emulator tests
        run: python -m pytest -q -p no:cacheprovider tests/test_cloud_emulators.py
