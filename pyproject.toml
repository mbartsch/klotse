[build-system]
requires = ["setuptools>=77"]  # 77+ understands the SPDX license field
build-backend = "setuptools.build_meta"

[project]
name = "klotse"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "kubernetes>=29", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[project.gui-scripts]
klotse = "klotse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "klotse.__version__"}

[tool.setuptools.package-data]
klotse = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
